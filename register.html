<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Money Notes</title>
    <link rel="icon" type="image/png" href="public/money.jfif">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="money-icon">💰</div>
                <h1>Money Notes</h1>
            </div>
            <h2>Buat Akun Baru</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <div class="input-with-icon">
                        <span>👤</span>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <span class="error" id="error-name"></span>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <div class="input-with-icon">
                        <span>📧</span>
                        <input type="email" id="reg-email" name="email" required>
                    </div>
                    <span class="error" id="error-reg-email"></span>
                </div>
                <div class="form-group">
                    <label for="reg-password">Kata Sandi</label>
                    <div class="input-with-icon">
                        <span>🔒</span>
                        <input type="password" id="reg-password" name="password" required minlength="6">
                    </div>
                    <span class="error" id="error-reg-password"></span>
                </div>
                <button type="submit" class="btn btn-primary">Daftar</button>
            </form>
            <div class="auth-footer">
                <p>Sudah punya akun? <a href="index.html">Masuk di sini</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
